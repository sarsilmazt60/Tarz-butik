name: Tarz Butik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper oluştur
        working-directory: tarz
        run: gradle wrapper

      - name: Debug APK oluştur
        working-directory: tarz
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: Tarz-Butik-APK
          path: tarz/app/build/outputs/apk/debug/*.apk
