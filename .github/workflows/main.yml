name: Tarz Butik APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q tarz-butik-gelistirilmis-veri-korumali-fixed.zip -d build-src

      - name: Check project
        run: |
          echo "=== Proje dosyaları ==="
          find build-src -maxdepth 3 -type f | head -100
          echo "=== debug.keystore kontrolü ==="
          find build-src -name "debug.keystore" -print

      - name: Build APK
        working-directory: build-src
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarz-butik-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
